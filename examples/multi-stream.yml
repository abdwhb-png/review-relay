name: Independent review streams
on:
    issue_comment:
        types: [created]
    pull_request_target:
        types: [opened, reopened, ready_for_review, synchronize]
    workflow_dispatch:
        inputs:
            pull_request:
                description: Pull request number
                type: string
                required: true
permissions: {}
jobs:
    review:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - config: .reviewrelay.json
                      review-commands: '["/review"]'
                      improve-commands: '["/improve"]'
                    - config: .reviewrelay.localization.json
                      review-commands: '["/review-localization", "/review-fr"]'
                      improve-commands: '["/improve-localization"]'
        permissions:
            contents: read
            actions: read
            checks: write
            pull-requests: write
        uses: abdwhb-png/review-relay/.github/workflows/review.yml@REVIEWRELAY_SHA
        with:
            config-path: ${{ matrix.config }}
            review-commands: ${{ matrix.review-commands }}
            improve-commands: ${{ matrix.improve-commands }}
        secrets:
            provider-env: ${{ secrets.REVIEWRELAY_PROVIDER_ENV }}
