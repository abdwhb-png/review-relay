[config]
model = "openrouter/deepseek/deepseek-v4.1-flash-1017"
custom_model_max_tokens = 1048576
max_model_tokens = 0
max_output_tokens = 393216
additional_reasoning_effort_models = ["deepseek/deepseek-v4.1-flash-1017"]
num_retries = 0
ai_timeout = 240
retry_same_model_on_timeout = false
output_run_details = true
reasoning_effort = "high"
response_language = "en-US"

[pr_reviewer]
require_risk_assessment = true
require_failure_modes = true
require_priority_files = true
require_estimate_effort_to_review = false
enable_review_labels_effort = false
enable_review_labels_security = false

[pr_code_suggestions]
committable_code_suggestions = true
