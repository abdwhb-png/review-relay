name: Validate ReviewRelay
on: [push, pull_request]
permissions:
    contents: read
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
            - name: Prepare the dependency firewall
              run: npm install --global --ignore-scripts --min-release-age=7 sfw@2.0.6
            - run: sfw npm ci
            - run: npm run check
            - run: node --test tests/infrastructure/*.test.mjs
            - run: node bin/install-runtime.mjs
              env:
                  REVIEW_OPERATION: validate
            - run: node bin/check-workflows.mjs
            - run: node bin/install-runtime.mjs
              env:
                  REVIEW_OPERATION: analyze
            - run: node bin/check-native.mjs
